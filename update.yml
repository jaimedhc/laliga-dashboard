name: Actualizar dashboard

on:
  schedule:
    - cron: "17 6 * * *"    # cada mañana (hora UTC)
    - cron: "17 17 * * *"   # y cada tarde, para recoger cuotas y resultados nuevos
  push:                     # y en cuanto subes archivos nuevos
    branches: [main]
    paths:
      - "build.py"
      - "model.py"
      - "app.js"
      - "style.css"
      - "template.html"
      - "calendario.json"
      - "fechas.json"
      - "players.py"
      - ".github/workflows/update.yml"
  workflow_dispatch:        # botón para ejecutarlo a mano

permissions:
  contents: write

concurrency:
  group: actualizar-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar jugadores (opcional)
        run: python players.py
        continue-on-error: true
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      - name: Generar página y registro de predicciones
        run: python build.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Actualizar datos"
          git pull --rebase --autostash
          git push
