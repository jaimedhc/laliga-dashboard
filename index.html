function rivalHtml(){
 if(rvFor!==sel||!rv||rv===sel){const c=CAL.filter(c=>c[2]===sel||c[3]===sel).sort((a,b)=>a[1]<b[1]?-1:1)[0];rv=c?(c[2]===sel?c[3]:c[2]):TEAMS.find(t=>t!==sel);rvFor=sel}
 return `<section class="c sc"><h2>Contra equipos parecidos al rival</h2><select id="rv" aria-label="Rival" style="width:auto">${TEAMS.filter(t=>t!==sel).sort((a,b)=>nm(a).localeCompare(nm(b),'es')).map(t=>`<option value="${t}" ${t===rv?'selected':''}>${nm(t)} (${posOf(t)}º)</option>`).join('')}</select>
 <select id="wn" aria-label="Ventana" style="margin-left:8px;width:auto">${[2,3,4].map(v=>`<option value="${v}" ${v===win?"selected":""}>±${v} puestos</option>`).join("")}</select><p class="note">Por defecto se elige el próximo partido pendiente del equipo. Se agrupan los equipos que están por encima y por debajo del rival en la clasificación actual, dentro de la ventana elegida (en los extremos de la tabla se recorta). Ampliar la ventana da más partidos pero menos parecidos.</p>${rvBlock(sel,rv)}${rvBlock(rv,sel)}
 <p class="note">Son muy pocos partidos (cada pareja se ha enfrentado como mucho una vez), así que son tendencias y no conclusiones.</p></section>`}

const mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0,vr=a=>a.length>1?a.reduce((s,x)=>s+(x-mean(a))**2,0)/(a.length-1):0;
const CMU=M.reduce((s,m)=>s+m.hc+m.ac,0)/(2*M.length),CHA=M.reduce((s,m)=>s+m.hc-m.ac,0)/(2*M.length);
const csig=k=>{const a=TEAMS.map(t=>games(t).map(x=>x[k])),w=a.reduce((s,x)=>s+vr(x),0)/a.length,n=a.reduce((s,x)=>s+x.length,0)/a.length;return{w,s:Math.max(vr(a.map(mean))-w/n,0.05)}};
const CF=csig('cf'),CA=csig('ca'),CT=Math.sqrt(vr(M.map(m=>m.hc+m.ac)));
const shr=(a,S)=>a.length?(mean(a)-CMU)*S.s/(S.s+S.w/a.length):0;
const expC=(t,o,home,d)=>CMU+(home?CHA:-CHA)+shr(games(t).filter(x=>!(x.d===d&&x.riv===o)).map(x=>x.cf),CF)+shr(games(o).filter(x=>!(x.d===d&&x.riv===t)).map(x=>x.ca),CA);
const sgn1=v=>(v>0?'+':'')+f1(v);
const cvs=x=>{const e=expC(sel,x.riv,x.h,x.d),d=x.cf-e,z=d/Math.sqrt(CF.w);return `<span class="${Math.abs(z)>=2?'sg':''}">${sgn1(d)} (${sgn1(z)} desv.)</span>`};
const cx=m=>{const e=expC(m.h,m.a,true,null)+expC(m.a,m.h,false,null);return `${f1(e)} (${f1(Math.max(e-CT,0))}-${f1(e+CT)})`};
function cornHtml(t){const gs=games(t),n=gs.length;
 const row=(lb,k,S)=>{const a=gs.map(x=>x[k]),m=mean(a),s=Math.sqrt(vr(a)),se=s/Math.sqrt(n),d=m-CMU;
  return `<tr><td>${lb}</td><td>${f1(m)}</td><td>${f1(s)}</td><td>±${f1(se)}</td><td>${sgn1(d)} ${Math.abs(d)>2*se?'(fuera del ruido)':'(dentro del ruido)'}</td><td>${f1(CMU+shr(a,S))}</td></tr>`};
 return `<section class="c sc"><h2>Córners: media y variación</h2><table class="mt"><tr><th></th><th>Media</th><th>Desv. típica</th><th>Error de la media</th><th>Frente a la liga (${f1(CMU)})</th><th>Esperable (encogido)</th></tr>${row('Córners a favor','cf',CF)}${row('Córners en contra','ca',CA)}</table>
 <p class="note">La desviación típica es cuánto varía el equipo de un partido a otro, en córners (en la liga, ${f1(Math.sqrt(CF.w))}). El error de la media es la incertidumbre de su media (desviación entre la raíz del número de partidos). "Fuera del ruido" significa que la diferencia con la liga supera dos errores. "Esperable" acerca la media a la de la liga según cuánta parte de la variación entre equipos es real (${f1(Math.sqrt(CF.s))} córners de desviación entre equipos).</p></section>`}
const ROWS=[['Goles','gf','ga'],['Goles 1ª parte','p1','q1'],['Goles 2ª parte','p2','q2'],['xG (goles esperados)','xf','xa'],['Tiros','sf','sa'],['Tiros a puerta','tf','ta'],['Córners','cf','ca'],['Faltas','ff','fa'],['Amarillas','yf','ya'],['Rojas','rf','ra']];
function paintTeam(){
 const gs=games(sel),H=gs.filter(x=>x.h),A=gs.filter(x=>!x.h),r=L.find(x=>x.t===sel),pos=L.indexOf(r)+1,n=gs.length;
 const w=gs.filter(x=>res(x)==='W').length,e=gs.filter(x=>res(x)==='D').length,l=n-w-e;
 const sum=k=>gs.reduce((s,x)=>s+x[k],0),cnt=f=>gs.filter(f).length,sgn=v=>(v>0?'+':'')+f1(v);
 const kp=[['Posición',pos+'º · '+r.pts+' pts'],['Balance',`${w}G ${e}E ${l}P`],['Goles',`${r.gf} a favor · ${r.ga} en contra`],['xG',`${f1(sum('xf'))} a favor · ${f1(sum('xa'))} en contra`],['Tarjetas',`${sum('yf')} amarillas · ${sum('rf')} rojas`]];
 const mk=gs.filter(x=>x.pw!==null),ex=mk.reduce((s,x)=>s+3*x.pw+x.pd,0),ptsM=mk.reduce((s,x)=>s+(res(x)==='W'?3:res(x)==='D'?1:0),0);
 const adv=[['Puntos por partido',f1(r.pts/n)],['Victorias',pc(w/n)],['Portería a cero',cnt(x=>x.ga===0)+' de '+n],['Sin marcar',cnt(x=>x.gf===0)+' de '+n],['Ambos marcan',pc(cnt(x=>x.gf>0&&x.ga>0)/n)],['Más de 2,5 goles',pc(cnt(x=>x.gf+x.ga>2)/n)],['Tiros a puerta / tiros',pc(sum('tf')/(sum('sf')||1))],['Goles / tiros',pc(sum('gf')/(sum('sf')||1))],['Goles menos xG',sgn(sum('gf')-sum('xf'))],['Pts reales vs cuotas',mk.length?`${ptsM} vs ${f1(ex)}`:'–']];
 const W=640,Ht=190,B=22,mx=Math.max(3,...gs.flatMap(x=>[x.gf,x.ga])),bw=(W-10)/n;
 let s=`<svg viewBox="0 0 ${W} ${Ht}" role="img" aria-label="Goles por partido">`;
 gs.forEach((x,i)=>{const x0=10+i*bw,h1=(Ht-B-14)*x.gf/mx,h2=(Ht-B-14)*x.ga/mx,b=bw*.3;
  s+=`<rect class="gf" rx="2" x="${x0+bw*.15}" y="${Ht-B-h1}" width="${b}" height="${h1}"><title>${nm(x.riv)}: ${x.gf}-${x.ga}</title></rect><rect class="ga" rx="2" x="${x0+bw*.15+b+2}" y="${Ht-B-h2}" width="${b}" height="${h2}"><title>${nm(x.riv)}: ${x.gf}-${x.ga}</title></rect>
  <text x="${x0+bw*.5}" y="${Ht-B-Math.max(h1,h2)-4}" text-anchor="middle">${x.gf}-${x.ga}</text><text x="${x0+bw*.5}" y="${Ht-6}" text-anchor="middle">${nm(x.riv).slice(0,3)}</text>`});
 s+='</svg>';
 const tr=ROWS.map(([lb,a,b])=>`<tr><td>${lb}</td><td>${f1(av(gs,a))}</td><td>${f1(av(gs,b))}</td><td>${f1(av(H,a))}</td><td>${f1(av(A,a))}</td></tr>`).join('');
 const ml=gs.map(x=>`<tr><td>${x.d}</td><td>${x.h?'Casa':'Fuera'}</td><td>${nm(x.riv)}</td><td><b>${x.gf}-${x.ga}</b> <span class="mu">(${x.p1}-${x.q1})</span></td><td>${f1(x.xf)}-${f1(x.xa)}</td><td>${x.sf} (${x.tf}) - ${x.sa} (${x.ta})</td><td>${x.cf}-${x.ca}</td><td>${x.ff}-${x.fa}</td><td>${x.yf}-${x.ya}</td><td>${x.rf}-${x.ra}</td><td>${cvs(x)}</td><td>${x.pw===null?'–':pc(x.pw)}</td></tr>`).join('');
 document.getElementById('team').innerHTML=`<h1 style="margin-bottom:10px">${nm(sel)}</h1>
 <div class="k">${kp.map(k=>`<div><span>${k[0]}</span><b style="font-size:${k[1].length>14?15:21}px">${k[1]}</b></div>`).join('')}</div>
 <section class="c"><h2>Forma reciente</h2><div class="f">${gs.map(x=>`<i class="${res(x)}" title="${nm(x.riv)} ${x.gf}-${x.ga}">${{W:'G',D:'E',L:'P'}[res(x)]}</i>`).join('')}</div></section>
 <section class="c sc"><h2>Goles por partido</h2>${s}<p class="lgd">Azul: goles a favor · Gris: goles en contra</p></section>
 <section class="c"><h2>Resumen avanzado</h2><div class="k s" style="margin:0">${adv.map(k=>`<div><span>${k[0]}</span><b>${k[1]}</b></div>`).join('')}</div></section>
 <section class="c sc"><h2>Promedios por partido</h2><table><tr><th></th><th>Equipo</th><th>Rival</th><th>Equipo en casa</th><th>Equipo fuera</th></tr>${tr}</table></section>
 ${cornHtml(sel)}<section class="c sc"><h2>Partidos</h2><table><tr><th>Fecha</th><th>Lugar</th><th>Rival</th><th>Resultado (descanso)</th><th>xG</th><th>Tiros (a puerta)</th><th>Córners</th><th>Faltas</th><th>Amarillas</th><th>Rojas</th><th>Córners vs esperado</th><th>Gana según cuotas</th></tr>${ml}</table></section>${rivalHtml()}${squadHtml()}`;
 document.querySelectorAll('.pl button').forEach(b=>b.onclick=()=>{ps=b.dataset.p;paintTeam()});document.querySelectorAll('#rv').forEach(s=>s.onchange=()=>{rv=s.value;paintTeam()});document.querySelectorAll('#wn').forEach(s=>s.onchange=()=>{win=+s.value;paintTeam()})}
const pr=x=>x<0.005?'<1 %':Math.round(x*100)+' %',f2=n=>n.toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2});
function paintModel(){const el=document.getElementById('mov');
 if(!MO||!MO.n){el.innerHTML='<section class="c"><p class="note">El modelo aparecerá cuando exista el archivo calendario.json.</p></section>';return}
 let bt='';const b=MO.bt;
 if(b){const rs=[['Mercado (cuotas de cierre)',b.market],['Modelo',b.model],['Mezcla 50/50',b.blend],['Reparto uniforme (1/3 cada uno)',b.uniform]],best=rs.slice(0,3).reduce((a,x)=>x[1].ll<a[1].ll?x:a);
  bt=`<section class="c sc"><h2>¿Mejora el modelo al mercado?</h2><table class="mt"><tr><th>Predictor</th><th>Brier</th><th>Log-loss</th></tr>${rs.map(r=>`<tr><td>${r[0]}</td><td>${f2(r[1].br)}</td><td>${f2(r[1].ll)}</td></tr>`).join('')}</table><p class="note">Valores más bajos son mejores. Se evalúan ${b.n} partidos, prediciendo cada uno solo con los anteriores (el modelo se reajusta cada 5 partidos). Ahora mismo el mejor predictor es: ${best[0]}. Con tan pocos partidos las diferencias pequeñas no son concluyentes${MO.sens?`: cambiar los parámetros del modelo mueve el log-loss entre ${f2(MO.sens[0])} y ${f2(MO.sens[1])}`:''}.</p></section>`}
 const kp=[['Ventaja de local',`+${Math.round(MO.hm*100)} % de goles`],['Partidos usados',MO.n],['Pendientes',MO.pend],['Simulaciones',MO.sims]];
 const nx=MO.next.map(m=>`<tr><td>${m.pp?'Aplazado':'J'+m.j+' · '+m.d}</td><td>${nm(m.h)} - ${nm(m.a)}</td><td>${pr(m.ph)}</td><td>${pr(m.pd)}</td><td>${pr(m.pa)}</td><td>${f1(m.xh)} - ${f1(m.xa)}</td><td>${m.sc} (${pr(m.scp)})</td><td>${pr(m.o25)}</td><td>${pr(m.bb)}</td><td>${cx(m)}</td></tr>`).join('');
 const sm=[...MO.teams].sort((x,y)=>y.exp-x.exp).map(t=>`<tr><td>${nm(t.t)}</td><td>${t.pts}</td><td>${f1(t.exp)}</td><td>${pr(t.ch)}</td><td>${pr(t.t4)}</td><td>${pr(t.rl)}</td></tr>`).join('');
 const rt=[...MO.teams].sort((x,y)=>y.att-x.att).map(t=>`<tr><td>${nm(t.t)}</td><td>×${f2(t.att)}</td><td>×${f2(t.df)}</td></tr>`).join('');
 el.innerHTML=`<div class="k">${kp.map(k=>`<div><span>${k[0]}</span><b>${k[1]}</b></div>`).join('')}</div>${bt}
 <section class="c sc"><h2>Próximos partidos</h2><table class="mt"><tr><th>Cuándo</th><th>Partido</th><th>1</th><th>X</th><th>2</th><th>Goles esperados</th><th>Resultado más probable</th><th>+2,5 goles</th><th>Ambos marcan</th><th>Córners esperados (rango ±1 desv.)</th></tr>${nx}</table><p class="note">El marcador es el más probable dentro del resultado favorito (1, X o 2), con su probabilidad entre paréntesis. Ningún marcador concreto supera el 10-15 %, así que sirve como referencia y no como pronóstico.</p></section>
 <section class="c sc"><h2>Simulación del resto de la liga</h2><table class="mt"><tr><th>Equipo</th><th>Pts ahora</th><th>Pts final esperados</th><th>Campeón</th><th>Champions (top 4)</th><th>Descenso</th></tr>${sm}</table><p class="note">Se simulan ${MO.sims} veces los ${MO.pend} partidos pendientes. El desempate se aproxima por diferencia de goles y goles a favor, no por el enfrentamiento directo.</p></section>
 <section class="c sc"><h2>Fuerza estimada de cada equipo</h2><table class="mt"><tr><th>Equipo</th><th>Ataque (goles marcados)</th><th>Defensa (goles encajados)</th></tr>${rt}</table><p class="note">Respecto a un equipo medio: ×1,20 en ataque son un 20 % más de goles; en defensa, valores menores de 1 encajan menos.</p></section>
 <section class="c"><h2>Cómo funciona</h2><p class="note">Modelo de Poisson con ataque y defensa por equipo y una ventaja de local común, ajustado solo con partidos de esta temporada. Mezcla goles reales y xG al 50 % para reducir el azar. Los valores se acercan a la media (regularización) porque hay pocos partidos. No usa lesiones, alineaciones ni cuotas de los próximos partidos.</p></section>`}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#nav button').forEach(x=>x.setAttribute('aria-pressed',x===b));const m=b.dataset.v==='mo';document.getElementById('eqv').hidden=m;document.getElementById('mov').hidden=!m;if(m)paintModel()});
go();
</script></body></html>
