 const tr=ROWS.map(([lb,a,b])=>`<tr><td>${lb}</td><td>${f1(av(gs,a))}</td><td>${f1(av(gs,b))}</td><td>${f1(av(H,a))}</td><td>${f1(av(A,a))}</td></tr>`).join('');
 const ml=gs.map(x=>`<tr><td>${x.d}</td><td>${x.h?'Casa':'Fuera'}</td><td>${nm(x.riv)}</td><td><b>${x.gf}-${x.ga}</b> <span class="mu">(${x.p1}-${x.q1})</span></td><td>${f1(x.xf)}-${f1(x.xa)}</td><td>${x.sf} (${x.tf}) - ${x.sa} (${x.ta})</td><td>${x.cf}-${x.ca}</td><td>${x.ff}-${x.fa}</td><td>${x.yf}-${x.ya}</td><td>${x.rf}-${x.ra}</td><td>${x.pw===null?'–':pc(x.pw)}</td></tr>`).join('');
 document.getElementById('team').innerHTML=`<h1 style="margin-bottom:10px">${nm(sel)}</h1>
 <div class="k">${kp.map(k=>`<div><span>${k[0]}</span><b style="font-size:${k[1].length>14?15:21}px">${k[1]}</b></div>`).join('')}</div>
 <section class="c"><h2>Forma reciente</h2><div class="f">${gs.map(x=>`<i class="${res(x)}" title="${nm(x.riv)} ${x.gf}-${x.ga}">${{W:'G',D:'E',L:'P'}[res(x)]}</i>`).join('')}</div></section>
 <section class="c sc"><h2>Goles por partido</h2>${s}<p class="lgd">Azul: goles a favor · Gris: goles en contra</p></section>
 <section class="c"><h2>Resumen avanzado</h2><div class="k s" style="margin:0">${adv.map(k=>`<div><span>${k[0]}</span><b>${k[1]}</b></div>`).join('')}</div></section>
 <section class="c sc"><h2>Promedios por partido</h2><table><tr><th></th><th>Equipo</th><th>Rival</th><th>Equipo en casa</th><th>Equipo fuera</th></tr>${tr}</table></section>
 <section class="c sc"><h2>Partidos</h2><table><tr><th>Fecha</th><th>Lugar</th><th>Rival</th><th>Resultado (descanso)</th><th>xG</th><th>Tiros (a puerta)</th><th>Córners</th><th>Faltas</th><th>Amarillas</th><th>Rojas</th><th>Gana según cuotas</th></tr>${ml}</table></section>${squadHtml()}`;
 document.querySelectorAll('.pl button').forEach(b=>b.onclick=()=>{ps=b.dataset.p;paintTeam()})}
const pr=x=>x<0.005?'<1 %':Math.round(x*100)+' %',f2=n=>n.toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2});
function paintModel(){const el=document.getElementById('mov');
 if(!MO||!MO.n){el.innerHTML='<section class="c"><p class="note">El modelo aparecerá cuando exista el archivo calendario.json.</p></section>';return}
 let bt='';const b=MO.bt;
 if(b){const rs=[['Mercado (cuotas de cierre)',b.market],['Modelo',b.model],['Mezcla 50/50',b.blend],['Reparto uniforme (1/3 cada uno)',b.uniform]],best=rs.slice(0,3).reduce((a,x)=>x[1].ll<a[1].ll?x:a);
  bt=`<section class="c sc"><h2>¿Mejora el modelo al mercado?</h2><table class="mt"><tr><th>Predictor</th><th>Brier</th><th>Log-loss</th></tr>${rs.map(r=>`<tr><td>${r[0]}</td><td>${f2(r[1].br)}</td><td>${f2(r[1].ll)}</td></tr>`).join('')}</table><p class="note">Valores más bajos son mejores. Se evalúan ${b.n} partidos, prediciendo cada uno solo con los anteriores (el modelo se reajusta cada 5 partidos). Ahora mismo el mejor predictor es: ${best[0]}. Con tan pocos partidos las diferencias pequeñas no son concluyentes${MO.sens?`: cambiar los parámetros del modelo mueve el log-loss entre ${f2(MO.sens[0])} y ${f2(MO.sens[1])}`:''}.</p></section>`}
 const kp=[['Ventaja de local',`+${Math.round(MO.hm*100)} % de goles`],['Partidos usados',MO.n],['Pendientes',MO.pend],['Simulaciones',MO.sims]];
 const nx=MO.next.map(m=>`<tr><td>${m.pp?'Aplazado':'J'+m.j+' · '+m.d}</td><td>${nm(m.h)} - ${nm(m.a)}</td><td>${pr(m.ph)}</td><td>${pr(m.pd)}</td><td>${pr(m.pa)}</td><td>${f1(m.xh)} - ${f1(m.xa)}</td><td>${m.sc} (${pr(m.scp)})</td><td>${pr(m.o25)}</td><td>${pr(m.bb)}</td></tr>`).join('');
 const sm=[...MO.teams].sort((x,y)=>y.exp-x.exp).map(t=>`<tr><td>${nm(t.t)}</td><td>${t.pts}</td><td>${f1(t.exp)}</td><td>${pr(t.ch)}</td><td>${pr(t.t4)}</td><td>${pr(t.rl)}</td></tr>`).join('');
 const rt=[...MO.teams].sort((x,y)=>y.att-x.att).map(t=>`<tr><td>${nm(t.t)}</td><td>×${f2(t.att)}</td><td>×${f2(t.df)}</td></tr>`).join('');
 el.innerHTML=`<div class="k">${kp.map(k=>`<div><span>${k[0]}</span><b>${k[1]}</b></div>`).join('')}</div>${bt}
 <section class="c sc"><h2>Próximos partidos</h2><table class="mt"><tr><th>Cuándo</th><th>Partido</th><th>1</th><th>X</th><th>2</th><th>Goles esperados</th><th>Resultado más probable</th><th>+2,5 goles</th><th>Ambos marcan</th></tr>${nx}</table><p class="note">El marcador es el más probable dentro del resultado favorito (1, X o 2), con su probabilidad entre paréntesis. Ningún marcador concreto supera el 10-15 %, así que sirve como referencia y no como pronóstico.</p></section>
 <section class="c sc"><h2>Simulación del resto de la liga</h2><table class="mt"><tr><th>Equipo</th><th>Pts ahora</th><th>Pts final esperados</th><th>Campeón</th><th>Champions (top 4)</th><th>Descenso</th></tr>${sm}</table><p class="note">Se simulan ${MO.sims} veces los ${MO.pend} partidos pendientes. El desempate se aproxima por diferencia de goles y goles a favor, no por el enfrentamiento directo.</p></section>
 <section class="c sc"><h2>Fuerza estimada de cada equipo</h2><table class="mt"><tr><th>Equipo</th><th>Ataque (goles marcados)</th><th>Defensa (goles encajados)</th></tr>${rt}</table><p class="note">Respecto a un equipo medio: ×1,20 en ataque son un 20 % más de goles; en defensa, valores menores de 1 encajan menos.</p></section>
 <section class="c"><h2>Cómo funciona</h2><p class="note">Modelo de Poisson con ataque y defensa por equipo y una ventaja de local común, ajustado solo con partidos de esta temporada. Mezcla goles reales y xG al 50 % para reducir el azar. Los valores se acercan a la media (regularización) porque hay pocos partidos. No usa lesiones, alineaciones ni cuotas de los próximos partidos.</p></section>`}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#nav button').forEach(x=>x.setAttribute('aria-pressed',x===b));const m=b.dataset.v==='mo';document.getElementById('eqv').hidden=m;document.getElementById('mov').hidden=!m;if(m)paintModel()});
go();
</script></body></html>
