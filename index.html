 const sm=[...MO.teams].sort((x,y)=>y.exp-x.exp).map(t=>`<tr><td>${nm(t.t)}</td><td>${t.pts}</td><td>${f1(t.exp)}</td><td>${pr(t.ch)}</td><td>${pr(t.t4)}</td><td>${pr(t.rl)}</td></tr>`).join('');

 <section class="c sc"><h2>Simulación del resto de la liga</h2><table class="mt"><tr><th>Equipo</th><th>Pts ahora</th><th>Pts final esperados</th><th>Campeón</th><th>Champions (top 4)</th><th>Descenso</th></tr>${sm}</table><p class="note">Se simulan ${MO.sims} veces los ${MO.pend} partidos pendientes. El error de la propia simulación es como mucho de ±0,8 puntos porcentuales. El desempate se aproxima por diferencia de goles y goles a favor, no por el enfrentamiento directo.</p></section>
